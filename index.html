<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Фарси с Амином</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Vazirmatn:wght@400;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one study column — topic chips, a big flip card, two answer buttons; a searchable word list below. Palette from Persian tilework: turquoise, lapis, saffron. */
:root{
  --bg:#edf3f3; --surface:#ffffff; --ink:#14273f; --muted:#5b6b7c; --line:#d3dfe1;
  --turq:#0b7f84; --turq-soft:#d6eeee; --lapis:#1f3f78; --saffron:#c98a07; --saffron-soft:#fbefd2;
  --again:#b5462f; --again-soft:#f7e1dc;
  --display:"Sora","Vazirmatn",ui-sans-serif,system-ui,sans-serif;
  --body:"Inter","Vazirmatn",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --script:"Vazirmatn","Segoe UI","Tahoma",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1622; --surface:#142335; --ink:#e7eef4; --muted:#93a4b5; --line:#24384e;
  --turq:#3cc2c4; --turq-soft:#123a40; --lapis:#8fb0ec; --saffron:#f0b53a; --saffron-soft:#3a2e12;
  --again:#f08a72; --again-soft:#3d211b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1622; --surface:#142335; --ink:#e7eef4; --muted:#93a4b5; --line:#24384e;
  --turq:#3cc2c4; --turq-soft:#123a40; --lapis:#8fb0ec; --saffron:#f0b53a; --saffron-soft:#3a2e12;
  --again:#f08a72; --again-soft:#3d211b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:1.75rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--turq)}
.sub{color:var(--muted);font-size:.875rem;margin:2px 0 0}
.stats{display:flex;gap:14px;font-variant-numeric:tabular-nums;font-size:.875rem;color:var(--muted)}
.stats b{color:var(--ink);font-family:var(--display);font-size:1.1rem;display:block;line-height:1.1}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .8125rem var(--body);padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip small{color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--lapis);border-color:var(--lapis);color:var(--surface)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.75}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;color:var(--muted);font:500 .8125rem var(--body);padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--turq-soft);color:var(--turq)}
.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .8125rem var(--body);padding:7px 12px;border-radius:10px;cursor:pointer}
.ghost:hover,.chip:hover{border-color:var(--turq)}
label.tog{display:inline-flex;gap:6px;align-items:center;font-size:.8125rem;color:var(--muted);cursor:pointer;margin-left:auto}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--turq);width:0;transition:width .3s}
.stage{perspective:1400px}
.card{position:relative;height:300px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);border-radius:20px}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px;text-align:center;
  background-image:radial-gradient(circle at 0 0,var(--turq-soft) 0 34px,transparent 35px),radial-gradient(circle at 100% 100%,var(--saffron-soft) 0 34px,transparent 35px)}
.back{transform:rotateY(180deg)}
.tag{position:absolute;top:16px;left:20px;font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.count{position:absolute;top:16px;right:20px;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.word{font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.2;text-wrap:balance;overflow-wrap:anywhere}
.word.script{font-family:var(--script);font-size:clamp(3.5rem,14vw,5.5rem);line-height:1.3;direction:rtl}
.word.long{font-size:clamp(1.15rem,4.2vw,1.6rem);line-height:1.35}
.note .fa{font-family:var(--script);font-size:1.15em;color:var(--ink)}
.front .word{color:var(--lapis)}
.back .word{color:var(--turq)}
.note{color:var(--muted);font-size:.9375rem;max-width:44ch;overflow-wrap:anywhere}
.hint{position:absolute;bottom:14px;font-size:.75rem;color:var(--muted)}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answer button{border:0;border-radius:14px;padding:14px;font:600 1rem var(--display);cursor:pointer}
#again{background:var(--again-soft);color:var(--again)}
#know{background:var(--turq);color:var(--surface)}
.answer button:hover{filter:brightness(1.05)}
button:focus-visible,.card:focus-visible,input:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.done{text-align:center;padding:40px 20px;background:var(--surface);border:1px solid var(--line);border-radius:20px}
.done h2{font-family:var(--display);margin:0 0 6px}
.done p{color:var(--muted);margin:0 0 16px}
section.list h2{font-family:var(--display);font-size:1.15rem;margin:0}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
#q{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;min-width:0;flex:1;max-width:280px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{font-weight:600;color:var(--lapis);width:45%;font-family:var(--body)}
td.sc{font-family:var(--script);font-size:1.4rem;line-height:1.3}
td.k{width:22px;color:var(--turq);font-weight:700}
tr.topic td{font-family:var(--display);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--saffron);padding-top:18px;border-bottom:0;font-weight:600}
td small{display:block;color:var(--muted);font-weight:400}
@media (max-width:480px){.card{height:260px}.face{padding:22px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1 id="h1">Фарси <span>с Амином</span></h1>
      <p class="sub" data-i="sub">Слова и буквы из чата с учителем и страниц учебника, июль–ноябрь</p>
    </div>
    <div class="stats"><div><b id="sTotal">0</b><span data-i="words">слов</span></div><div><b id="sKnown">0</b><span data-i="learned">выучено</span></div></div>
  </header>

  <div class="chips" id="chips" role="group" aria-label="Темы"></div>

  <div class="controls">
    <div class="seg" role="group" aria-label="Направление">
      <button id="dirFa" aria-pressed="true">Фарси → Рус</button>
      <button id="dirRu" aria-pressed="false">Рус → Фарси</button>
    </div>
    <div class="seg" role="group" aria-label="Язык перевода">
      <button id="langRu" aria-pressed="true">RU</button>
      <button id="langEn" aria-pressed="false">EN</button>
    </div>
    <button class="ghost" id="shuffle" data-i="shuffle">Перемешать</button>
    <button class="ghost" id="reset">Сбросить прогресс</button>
    <label class="tog"><input type="checkbox" id="showKnown"> <span data-i="showKnown">показывать выученные</span></label>
  </div>

  <div class="progress"><i id="bar"></i></div>

  <div id="study">
    <div class="stage">
      <div class="card" id="card" tabindex="0" role="button" aria-label="Перевернуть карточку">
        <div class="face front"><span class="tag" id="tagF"></span><span class="count" id="countF"></span><div class="word" id="wF"></div><div class="note" id="nF"></div><span class="hint" data-i="hint">нажми, чтобы увидеть перевод</span></div>
        <div class="face back"><span class="tag" id="tagB"></span><span class="count" id="countB"></span><div class="word" id="wB"></div><div class="note" id="nB"></div></div>
      </div>
    </div>
    <div class="answer" style="margin-top:12px">
      <button id="again" data-i="again">Повторить</button>
      <button id="know" data-i="know">Знаю</button>
    </div>
  </div>
  <div class="done" id="done" hidden>
    <h2 data-i="doneH">Тема пройдена</h2>
    <p data-i="doneP">Все карточки в этой теме отмечены как выученные.</p>
    <button class="ghost" id="restart" data-i="restart">Пройти ещё раз</button>
  </div>
  <p class="sub" style="margin:0" data-i="keys">Пробел — перевернуть · ← повторить · → знаю</p>

  <section class="list">
    <div class="listhead"><h2 data-i="allWords">Все слова</h2><input id="q" type="search" placeholder="Поиск по фарси или русскому" aria-label="Поиск"></div>
    <div style="overflow-x:auto"><table id="tbl"></table></div>
  </section>
</div>

};

const CARDS=[];
const EN_NOTE={"перевод мой — сверь с учителем":"my translation — check with your teacher","из чата":"from the chat"};
for(const [topic,block] of Object.entries(RAW)){
  const enLines=(EN[topic]||"").trim().split("\n");
  block.trim().split("\n").forEach((line,i)=>{
    const [f,r,n]=line.split("|").map(s=>s&&s.trim());
    const [e,en]=(enLines[i]||"").split("|").map(s=>s&&s.trim());
    const note=n||"";
    if(f&&r) CARDS.push({id:topic+"::"+f,f,r,n:note,e:e||r,en:en||EN_NOTE[note]||note,fe:f.replace(/глагол/g,"verb"),t:topic});
  });
}
const TOPICS=Object.keys(RAW);

const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let known=new Set(LS.get("fa-known",[]));
let topic=LS.get("fa-topic","all");
let dir=LS.get("fa-dir","fa");
let lang=LS.get("fa-lang","ru"); if(lang!=="en") lang="ru";
const fw=c=>lang==="en"?c.fe:c.f, tw=c=>lang==="en"?c.e:c.r, tn=c=>lang==="en"?c.en:c.n;
const UI={
 ru:{sub:"Слова и буквы из чата с учителем и страниц учебника, июль–ноябрь",words:"слов",learned:"выучено",shuffle:"Перемешать",reset:"Сбросить прогресс",sure:"Точно сбросить?",showKnown:"показывать выученные",hint:"нажми, чтобы увидеть перевод",again:"Повторить",know:"Знаю",doneH:"Тема пройдена",doneP:"Все карточки в этой теме отмечены как выученные.",restart:"Пройти ещё раз",keys:"Пробел — перевернуть · ← повторить · → знаю",allWords:"Все слова",all:"Все",known:"выучено",none:"Ничего не найдено. Попробуй другое слово.",q:"Поиск по фарси или русскому",dirFa:"Фарси → Рус",dirRu:"Рус → Фарси",flip:"Перевернуть карточку"},
 en:{sub:"Words and letters from the chat with my teacher and textbook pages, July–November",words:"words",learned:"learned",shuffle:"Shuffle",reset:"Reset progress",sure:"Reset for sure?",showKnown:"show learned",hint:"tap to see the translation",again:"Again",know:"I know it",doneH:"Topic complete",doneP:"Every card in this topic is marked as learned.",restart:"Go through again",keys:"Space — flip · ← again · → I know it",allWords:"All words",all:"All",known:"learned",none:"Nothing found. Try another word.",q:"Search Farsi or English",dirFa:"Farsi → Eng",dirRu:"Eng → Farsi",flip:"Flip the card"}
};
const TOPIC_EN={"Алфавит":"Alphabet","Семья и люди":"Family & people","Приветствия и вежливость":"Greetings & politeness","Вопросы":"Questions","Местоимения и маленькие слова":"Pronouns & small words","Глаголы":"Verbs","Время":"Time","Месяцы":"Months","Числа":"Numbers","Еда":"Food","Прилагательные":"Adjectives","Вещи и места":"Things & places","Грамматика":"Grammar","Фразы":"Phrases","Предложения из учебника":"Textbook sentences","Предложения: упражнения":"Exercise sentences","Из учебника":"From the textbook","Мои заметки":"My notes"};
const L=k=>UI[lang][k], TN=t=>lang==="en"?(TOPIC_EN[t]||t):t;
let showKnown=false;
let deck=[],pos=0;
const $=id=>document.getElementById(id);

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(){return CARDS.filter(c=>(topic==="all"||c.t===topic))}
function build(doShuffle){
  deck=pool().filter(c=>showKnown||!known.has(c.id));
  if(doShuffle) shuffle(deck);
  pos=0; render();
}
function renderChips(){
  const all=[["all",L("all"),CARDS.length],...TOPICS.map(t=>[t,TN(t),CARDS.filter(c=>c.t===t).length])];
  $("chips").innerHTML=all.map(([k,l,n])=>`<button class="chip" data-k="${esc(k)}" aria-pressed="${k===topic}">${esc(l)}<small>${n}</small></button>`).join("");
}
function render(){
  $("card").classList.remove("flipped");
  const p=pool(), k=p.filter(c=>known.has(c.id)).length;
  $("sTotal").textContent=CARDS.length; $("sKnown").textContent=known.size;
  $("bar").style.width=(p.length?k/p.length*100:0)+"%";
  const empty=!deck.length;
  $("study").hidden=empty; $("done").hidden=!empty;
  if(empty) return;
  const c=deck[pos%deck.length];
  const F=fw(c), T=tw(c), N=tn(c);
  const front=dir==="fa"?{w:F,n:""}:{w:T,n:""};
  const back=dir==="fa"?{w:T,n:N}:{w:F,n:N};
  // при обратном направлении задерживаем смену задней стороны, чтобы ответ не мелькал
  const isScript=w=>/^[؀-ۿ\s]+$/.test(w);
  $("wF").textContent=front.w; $("nF").textContent=front.n; $("wF").classList.toggle("script",isScript(front.w)); $("wF").classList.toggle("long",front.w.length>34);
  setTimeout(()=>{ $("wB").textContent=back.w; $("nB").textContent=back.n; $("wB").classList.toggle("script",isScript(back.w)); $("wB").classList.toggle("long",back.w.length>34); },160);
  const tag=TN(c.t)+(known.has(c.id)?" · "+L("known"):"");
  $("tagF").textContent=$("tagB").textContent=tag;
  $("countF").textContent=$("countB").textContent=`${(pos%deck.length)+1} / ${deck.length}`;
}
function flip(){$("card").classList.toggle("flipped")}
function answer(ok){
  if(!deck.length) return;
  const c=deck[pos%deck.length];
  if(ok){known.add(c.id); LS.set("fa-known",[...known]);
    if(!showKnown){deck.splice(pos%deck.length,1); if(deck.length) pos=pos%deck.length; render(); renderList(); return;}
  } else {
    // «повторить»: карточка вернётся через несколько позиций
    deck.splice(pos%deck.length,1); const at=Math.min(deck.length,(pos%Math.max(deck.length,1))+4); deck.splice(at,0,c);
    known.delete(c.id); LS.set("fa-known",[...known]);
    render(); renderList(); return;
  }
  pos++; render(); renderList();
}
function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function renderList(){
  const q=$("q").value.trim().toLowerCase();
  let html="";
  for(const t of TOPICS){
    const rows=CARDS.filter(c=>c.t===t&&(!q||(c.f+" "+c.r+" "+c.n+" "+c.e+" "+c.en).toLowerCase().includes(q)));
    if(!rows.length) continue;
    html+=`<tr class="topic"><td colspan="3">${esc(TN(t))} · ${rows.length}</td></tr>`;
    html+=rows.map(c=>`<tr><td${/^[؀-ۿ\s]+$/.test(c.f)?' class="sc"':''}>${esc(fw(c))}</td><td>${esc(tw(c))}${tn(c)?`<small>${esc(tn(c))}</small>`:""}</td><td class="k">${known.has(c.id)?"✓":""}</td></tr>`).join("");
  }
  $("tbl").innerHTML=html||`<tr><td colspan="3">${L("none")}</td></tr>`;
}
function setDir(d){dir=d;LS.set("fa-dir",d);$("dirFa").setAttribute("aria-pressed",d==="fa");$("dirRu").setAttribute("aria-pressed",d==="ru");render()}
function setLang(l){lang=l;LS.set("fa-lang",l);const en=l==="en";
  $("langRu").setAttribute("aria-pressed",!en);$("langEn").setAttribute("aria-pressed",en);
  $("dirFa").textContent=L("dirFa");$("dirRu").textContent=L("dirRu");$("q").placeholder=L("q");
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=L(el.dataset.i));
  const rb=$("reset");delete rb.dataset.armed;rb.textContent=L("reset");
  $("h1").replaceChildren(en?"Farsi ":"Фарси ",Object.assign(document.createElement("span"),{textContent:en?"with Amin":"с Амином"}));
  $("card").setAttribute("aria-label",L("flip"));
  document.documentElement.lang=l;document.title=en?"Farsi with Amin":"Фарси с Амином";
  renderChips();render();renderList()}

$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;topic=b.dataset.k;LS.set("fa-topic",topic);renderChips();build(true)});
$("card").addEventListener("click",flip);
$("card").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();flip()}});
$("know").addEventListener("click",()=>answer(true));
$("again").addEventListener("click",()=>answer(false));
$("shuffle").addEventListener("click",()=>build(true));
$("restart").addEventListener("click",()=>{pool().forEach(c=>known.delete(c.id));LS.set("fa-known",[...known]);build(true);renderList()});
$("reset").addEventListener("click",function(){
  if(this.dataset.armed){known=new Set();LS.set("fa-known",[]);delete this.dataset.armed;this.textContent=L("reset");build(true);renderList();}
  else{this.dataset.armed="1";this.textContent=L("sure");setTimeout(()=>{delete this.dataset.armed;this.textContent=L("reset")},3000)}
});
$("showKnown").addEventListener("change",e=>{showKnown=e.target.checked;build(true)});
$("dirFa").addEventListener("click",()=>setDir("fa"));
$("dirRu").addEventListener("click",()=>setDir("ru"));
$("langRu").addEventListener("click",()=>setLang("ru"));
$("langEn").addEventListener("click",()=>setLang("en"));
$("q").addEventListener("input",renderList);
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.code==="Space"){e.preventDefault();flip()}
  else if(e.key==="ArrowRight")answer(true);
  else if(e.key==="ArrowLeft")answer(false);
});
if(topic!=="all"&&!TOPICS.includes(topic)) topic="all";
renderChips(); setDir(dir); setLang(lang); build(true);
</script>
